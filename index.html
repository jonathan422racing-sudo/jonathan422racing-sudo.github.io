<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Game Container</title>
    <style>
        /* This layout ensures the game occupies the entire browser window without layout gaps */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000;
        }
        iframe { 
            border: none; 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>

    <!-- This securely loads your game directly from the storage source -->
    <iframe src="https://github.io" allow="fullscreen; gamepad; autoplay"></iframe>

    <script>
        let isGameActive = false;

        // Tracks a user action on the webpage container
        window.addEventListener('click', () => {
            isGameActive = true;
        });

        // Catches browser closure events and triggers the notification layout
        window.addEventListener('beforeunload', (event) => {
            if (isGameActive) {
                event.preventDefault();
                event.returnValue = ''; // Prompts the browser's custom built-in warning overlay
            }
        });
    </script>
</body>
</html>
